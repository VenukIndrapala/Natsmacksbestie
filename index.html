<!-- index.html -->
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HBD love</title>
    <link type="text/css" rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Initial Lamp Page View -->
    <div class="scene-wrapper" id="lampScene">
        <!-- Lamp Component (Locked & Unchanged) -->
        <div class="lamp-container">
            <div class="lamp-shade-shadow"></div>
            <div class="lamp-head">
                <div class="lamp-rim"></div>
            </div>
            <div class="lamp-stand-group">
                <div class="lamp-stand"></div>
                <!-- Pull Chain -->
                <div class="chain-wrapper" id="chainToggle">
                    <div class="chain-cord"></div>
                    <div class="chain-ball"></div>
                </div>
            </div>
            <div class="lamp-base"></div>
            <div class="lamp-glow"></div>
        </div>

        <!-- Login Card -->
        <div class="login-card" id="loginCard">
            <h2>Welcome</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" required>
                </div>
                <button type="submit" class="sign-in-btn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- The Tree & Heart Animation Scene matching the reference code structure -->
    <div class="main-scene" id="mainScene">
        <div id="error">
            <a href="http://www.google.cn/chrome/intl/zh-CN/landing_chrome.html?hl=zh-CN&brand=CHMI">Chrome</a> 
            (<a href="http://firefox.com.cn/download/">Firefox</a>)
        </div>
        <div id="wrap">
            <div id="text">
                <div id="code">
                    <span class="say">Hey, you :)</span><br>
                    <span class="say"> </span><br>
                    <span class="say">Happy Birthday !</span><br>
                    <span class="say"> </span><br>
                    <span class="say">May God bless you.</span><br>
                    <span class="say"> </span><br>
                    <span class="say">And give you many happiness :)</span><br>
                    <span class="say"> </span><br>
                    <span class="say">Always keep smiling...</span><br>
                    <span class="say"> </span><br>
                    <span class="say">-- Yours truly, forever.</span><br>
                </div>
            </div>
            <div id="clock-box">
                <span class="STYLE1"></span><font color="#33CC00"></font>
                <span class="STYLE1"></span>
                <div id="clock"></div>
            </div>
            <canvas id="canvas" width="1100" height="680"></canvas>
        </div>
        <audio autoplay="autoplay" height="100" width="100" id="myAudio">
            <source src="aud.mp3" type="audio/mp3" />
        </audio>
    </div>

    <!-- External Script Dependencies matching the reference code -->
    <script src="file/jquery.min.js"></script>
    <script src="file/jscex.min.js"></script>
    <script src="file/jscex-parser.js"></script>
    <script src="file/jscex-jit.js"></script>
    <script src="file/jscex-builderbase.min.js"></script>
    <script src="file/jscex-async.min.js"></script>
    <script src="file/jscex-async-powerpack.min.js"></script>
    <script src="file/function.js" charset="utf-8"></script>
    <script src="file/love.js" charset="utf-8"></script>

    <script src="tree.js"></script>
</body>
</html>
