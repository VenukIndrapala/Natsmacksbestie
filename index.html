<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HBD love</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Initial Lamp Page View -->
    <div class="scene-wrapper" id="lampScene">
        <div class="lamp-container">
            <div class="lamp-shade-shadow"></div>
            <div class="lamp-head">
                <div class="lamp-rim"></div>
            </div>
            <div class="lamp-stand-group">
                <div class="lamp-stand"></div>
                <div class="chain-wrapper" id="chainToggle">
                    <div class="chain-cord"></div>
                    <div class="chain-ball"></div>
                </div>
            </div>
            <div class="lamp-base"></div>
            <div class="lamp-glow"></div>
        </div>

        <div class="login-card" id="loginCard">
            <h2>Welcome</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" required>
                </div>
                <button type="submit" class="sign-in-btn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Exact Replicated Video Animation Scene -->
    <div class="video-animation-scene" id="videoAnimationScene">
        <!-- Interactive Click Me Heart Prompt matching video start -->
        <div class="click-prompt" id="clickPrompt">
            <div class="pulse-heart"></div>
            <span>Click Me :)<br><small>Birthday Queen !</small></span>
        </div>

        <canvas id="treeCanvas"></canvas>
        <div class="love-message" id="loveMessage"></div>
        <audio id="myAudio" loop>
            <source src="aud.mp3" type="audio/mp3">
        </audio>
    </div>

    <script src="tree.js"></script>
</body>
</html>
