<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lamp Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene-wrapper">
        <!-- Lamp Component meticulously matched to the reference image -->
        <div class="lamp-container">
            <div class="lamp-head"></div>
            <div class="lamp-stand-group">
                <div class="lamp-stand"></div>
                <!-- Pull Chain positioned right underneath the lamp shade -->
                <div class="chain-wrapper" id="chainToggle">
                    <div class="chain-cord"></div>
                    <div class="chain-ball"></div>
                </div>
            </div>
            <div class="lamp-base"></div>
            <div class="lamp-glow"></div>
        </div>

        <!-- Login Card positioned neatly to the right so it never overlaps the lamp -->
        <div class="login-card" id="loginCard">
            <h2>Welcome</h2>
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" placeholder="Your name" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="sign-in-btn">Sign In</button>
            </form>
        </div>
    </div>

    <script src="tree.js"></script>
</body>
</html>
